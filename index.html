<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURØN × Editz</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: url("https://wallpaperaccess.com/full/3063067.jpg") no-repeat center/cover;
}

/* Dark overlay */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: -1;
}

/* Navbar */
nav {
  padding: 15px;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(10px);
}

nav a {
  color: white;
  margin: 15px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

nav a:hover {
  color: red;
}

/* Hero */
.hero {
  margin-top: 100px;
}

.hero h1 {
  font-size: 55px;
  text-shadow: 0 0 20px red;
}

.hero p {
  font-size: 20px;
  opacity: 0.8;
}

/* Button */
.btn {
  margin-top: 20px;
  padding: 12px 25px;
  background: red;
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
  border-radius: 10px;
  transition: 0.3s;
}

.btn:hover {
  background: black;
  border: 1px solid red;
}

/* Cards */
.cards {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  margin: 50px;
}

.card {
  background: rgba(0,0,0,0.7);
  padding: 20px;
  margin: 15px;
  border-radius: 15px;
  width: 250px;
  box-shadow: 0 0 15px red;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.1);
}

/* Video Section */
.video-section {
  margin: 50px;
}

iframe {
  width: 80%;
  height: 400px;
  border-radius: 15px;
}

/* Footer */
footer {
  margin-top: 50px;
  padding: 20px;
  background: black;
  opacity: 0.8;
}
</style>
</head>

<body>

<nav>
  <a href="#">Home</a>
  <a href="#videos">Edits</a>
  <a href="#">About</a>
</nav>

<div class="hero">
  <h1>AURØN × Editz 🔥</h1>
  <p>Anime Edits | Aesthetic | Power</p>
  <button class="btn">Subscribe</button>
</div>

<div class="cards">
  <div class="card">
    <h3>🔥 Gojo Edit</h3>
    <p>Insane power vibes</p>
  </div>

  <div class="card">
    <h3>⚡ Toji Edit</h3>
    <p>Dark aesthetic energy</p>
  </div>

  <div class="card">
    <h3>💀 Sukuna Edit</h3>
    <p>King of curses</p>
  </div>
</div>

<div class="video-section" id="videos">
  <h2>🎬 My Edits</h2>
  <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
</div>

<footer>
  <p>© 2026 AURØN × Editz</p>
</footer>

</body>
</html>

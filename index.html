<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURØN × Editz</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
  text-align: center;
}

/* Animated Background */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: linear-gradient(45deg, red, black, purple);
  background-size: 300% 300%;
  animation: glow 10s infinite;
  z-index: -1;
}

@keyframes glow {
  0% {background-position: 0%;}
  50% {background-position: 100%;}
  100% {background-position: 0%;}
}

/* Navbar */
nav {
  padding: 15px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
}

nav a {
  color: white;
  margin: 15px;
  text-decoration: none;
  font-weight: bold;
}

/* Hero Section */
.hero {
  margin-top: 100px;
}

.hero h1 {
  font-size: 50px;
  text-shadow: 0 0 20px red;
}

.hero p {
  font-size: 20px;
  opacity: 0.8;
}

/* Button */
.btn {
  margin-top: 20px;
  padding: 12px 25px;
  background: red;
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
  border-radius: 10px;
  transition: 0.3s;
}

.btn:hover {
  background: black;
  border: 1px solid red;
}

/* Cards */
.cards {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  margin: 50px;
}

.card {
  background: rgba(0,0,0,0.7);
  padding: 20px;
  margin: 15px;
  border-radius: 15px;
  width: 250px;
  box-shadow: 0 0 15px red;
}

/* Footer */
footer {
  margin-top: 50px;
  padding: 20px;
  background: black;
  opacity: 0.7;
}
</style>
</head>

<body>

<nav>
  <a href="#">Home</a>
  <a href="#">Edits</a>
  <a href="#">About</a>
</nav>

<div class="hero">
  <h1>AURØN × Editz 🔥</h1>
  <p>Anime Edits | Aesthetic | Power</p>
  <button class="btn">Watch Now</button>
</div>

<div class="cards">
  <div class="card">
    <h3>🔥 Gojo Edit</h3>
    <p>Insane power vibes</p>
  </div>

  <div class="card">
    <h3>⚡ Toji Edit</h3>
    <p>Dark aesthetic energy</p>
  </div>

  <div class="card">
    <h3>💀 Sukuna Edit</h3>
    <p>King of curses</p>
  </div>
</div>

<footer>
  <p>© 2026 AURØN × Editz</p>
</footer>

</body>
</html>

/* Loader */
#loader {

  margin: 15px;

}

.card:hover {
  transform: scale(1.1);
}

/* Video Grid */
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin: 20px;
}

.video-grid iframe {
  width: 100%;
  height: 250px;
  border-radius: 10px;
}

/* Social */
